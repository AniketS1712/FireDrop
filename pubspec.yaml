name: eagle_esports
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_messaging: ^16.1.1
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  intl: ^0.20.2
  uuid: ^4.5.2
  font_awesome_flutter: ^10.12.0
  cloud_firestore: ^6.1.2
  youtube_player_iframe: ^5.2.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.1
  firebase_storage: ^13.1.0
  flutter_cashfree_pg_sdk: ^2.2.10+48
  http: ^1.2.1
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^21.0.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - .env
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-SemiBold.ttf
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-SemiBold.ttf
        - asset: assets/fonts/Orbitron-ExtraBold.ttf
          weight: 800

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpeg"
